# Shadow Fix: runs the pinned Shadow Patch Action. No engine files live in this repository.
name: Shadow Fix

on:
  issues:
    types: [labeled]

concurrency:
  group: shadow-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify-and-open-pr:
    if: github.event.label.name == 'shadow-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: creatoropener/shadow-patch@v0.6.0-rc.39
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          nebius-project-id: ${{ secrets.NEBIUS_PROJECT_ID }}
          nebius-model: ${{ vars.NEBIUS_MODEL || secrets.NEBIUS_MODEL }}
          agent-mode: legacy
          # The specification profile is how both development cases verified (the model writes the
          # examples quoted from the issue, the engine compiles the test). If it stops with
          # needs_specification, change this one line to freeform and label the issue again.
          verifier-profile: spec
          image-node-typescript: ${{ secrets.CONTREE_IMAGE_NODE_TYPESCRIPT }}
